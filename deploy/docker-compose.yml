# DineX production stack:  Caddy (HTTPS) -> web (Next.js) + backend (Django) -> PostgreSQL
# Folder layout expected:   ./deploy (this file)   ./dinex (backend)   ./dinex-web (frontend)
name: dinex

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no "ports:" on purpose: the database is reachable only from inside this stack

  backend:
    build: ../dinex
    image: dinex-backend
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
      - static:/data/static
    expose:
      - "8000"
    healthcheck:
      # Django only answers for hosts in ALLOWED_HOSTS, so the check must say which domain it is asking for
      test: ["CMD", "curl", "-fsS", "-H", "Host: ${DOMAIN}", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Daily subscription job: issues invoices, marks overdue, suspends after the grace period.
  scheduler:
    image: dinex-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python manage.py run_billing; sleep 21600; done"]

  # Loyalty reminder emails: runs once a day; each customer is reminded at most every 3 days (about twice a week).
  reminders:
    image: dinex-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; python manage.py send_loyalty_reminders; sleep 82800; done"]

  web:
    build:
      context: ../dinex-web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web

  # Nightly database + uploaded-images backup into the "backups" volume (see deploy/README.md for off-server copies)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - media:/media:ro
      - ./backup-loop.sh:/backup-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/backup-loop.sh"]

volumes:
  pgdata:
  media:
  static:
  backups:
  caddy_data:
  caddy_config:
